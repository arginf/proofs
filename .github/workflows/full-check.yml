# Full rebuild, kernel re-check and audit of everything on main, a capped amount per run.
#
# A maintainer can also run it on a branch (gh workflow run full-check.yml --ref <branch>) to
# check a whole branch without a PR; such runs build and report but record nothing.
#
# Runs when lean-toolchain, lake-manifest.json or lakefile.toml change on main (a bump changes the
# audit cache's environment key, so every statement becomes pending), daily as a safety net (it
# picks up anything a cancelled or failed main run missed, and resumes a bump that didn't finish),
# and by hand. Work is a matrix over shards of pending statements (tools/incremental.py matrix);
# whatever doesn't fit in this run's caps waits for the next run. A run with nothing pending takes
# about a minute and builds no Lean.
#
# Contributed Lean is built only in the read-only check jobs. The record job, the only one that
# can write, handles nothing but cache files, which tools/incremental.py validates on load.
name: full check
on:
  push:
    branches: [main]
    paths: [lean-toolchain, lake-manifest.json, lakefile.toml]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      ignore_cache:
        description: Re-check everything, ignoring cached passes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: full-check
  cancel-in-progress: false
env:
  MAX_JOBS: 16 # parallel runners per run (public repos get 20 concurrent jobs)
  MAX_MODULES: 1500 # modules per job, well inside the 6-hour job limit
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Audit cache from the index branch
        run: |
          # The data branch's cache/audit/ shards; until that branch exists, the index branch's file.
          rm -rf .audit-src && mkdir -p .audit-src
          if git fetch -q --depth=1 origin data 2>/dev/null && git archive FETCH_HEAD cache/audit 2>/dev/null | tar -x -C .audit-src 2>/dev/null; then SRC=.audit-src/cache/audit
          else git fetch -q --depth=1 origin index 2>/dev/null && git show FETCH_HEAD:audit-cache.json > .audit-src/index.json 2>/dev/null || echo '{}' > .audit-src/index.json; SRC=.audit-src/index.json; fi
          python3 -m tools.incremental merge-cache --out audit-cache.json "$SRC"
      - id: matrix
        env:
          IGNORE: ${{ inputs.ignore_cache && '--ignore-cache' || '' }}
        run: |
          M=$(python3 -m tools.incremental matrix --cache audit-cache.json --max-jobs "$MAX_JOBS" --max-modules "$MAX_MODULES" $IGNORE)
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          if [ "$(jq '.include | length' <<<"$M")" != "0" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cache-base
          path: audit-cache.json
          retention-days: 7
  check:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: check ${{ matrix.name }}
    env:
      S: ${{ matrix.statements }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cache-base
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: false
          use-mathlib-cache: false
      # Restore only: main saves the dependency cache before any theorem folder is compiled.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Fetch any missing build outputs
        run: |
          lake exe cache get || true
          (cd .lake/packages/cslib-frontier && bash scripts/cache/get.sh) || echo "frontier cache miss"
      - name: Lexical checks
        run: python3 -m tools.incremental lexical $S
      - name: Build
        run: lake build $(python3 -m tools.incremental targets $S)
      - name: Kernel re-check (leanchecker)
        id: kernel
        run: python3 tools/arginf.py kernel $S
      - name: Audit (cached passes are skipped; new passes are recorded even if one proof fails)
        if: ${{ !cancelled() && steps.kernel.outcome == 'success' }}
        run: python3 -m tools.incremental audit --cache audit-cache.json $S
      - name: Record built statements
        if: ${{ !cancelled() && steps.kernel.outcome == 'success' }}
        run: python3 -m tools.incremental built --cache audit-cache.json $S
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: cache-part-${{ matrix.name }}
          path: audit-cache.json
          retention-days: 7
  record:
    # Merge every job's passes into cache/audit/ on the data branch, as one new commit. A push
    # that races a publish is retried; if it still fails, the next run simply redoes the work.
    needs: [plan, check]
    # Only main's results are recorded; a run dispatched on a branch just reports.
    if: ${{ !cancelled() && needs.plan.outputs.any == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cache-part-*
          path: parts
      - name: Commit the merged cache to the data branch
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          for try in 1 2 3 4; do
            rm -rf data && python3 -m tools.publish checkout --remote "$REMOTE" --dir data
            mkdir -p data/cache/audit
            python3 -m tools.incremental merge-cache --out data/cache/audit data/cache/audit parts/*/audit-cache.json
            git -C data config user.name "arginf-bot" && git -C data config user.email "actions@users.noreply.github.com"
            python3 -m tools.publish push --dir data --remote "$REMOTE" --message "audit cache from full check $GITHUB_RUN_ID" && exit 0
            sleep $((try * 15))
          done
          echo "::warning::could not record the cache; the next run redoes this work"
  alert:
    needs: check
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update an issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$REPO/issues" -f title="Full check failed (run $GITHUB_RUN_ID)" \
            -f body="Some merged statements no longer build, kernel-check or audit under the current toolchain and dependencies: $RUN_URL. Failed statements stay pending, so every run retries them until they are fixed or ported." \
            -f "labels[]=full-check-failed" >/dev/null

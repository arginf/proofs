# On every merge: check what the merge added (not the whole repo), then republish the index.
# Toolchain and Mathlib bumps, and anything a cancelled run missed, are rebuilt by full-check.yml.
name: main
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the push's before..after diff
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: What this push added
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != "push" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # Manual run or no usable base: check every folder lexically; Lean is full-check.yml's.
            echo "statements=" >> "$GITHUB_OUTPUT"; echo "lexical_full=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PLAN=$(python3 -m tools.incremental plan --base "$BEFORE" --head "$GITHUB_SHA")
          jq -r '.reasons[]' <<<"$PLAN"
          S=$(jq -r '.statements | join(" ")' <<<"$PLAN")
          echo "statements=$S" >> "$GITHUB_OUTPUT"
          echo "lexical_full=$(jq -r .lexicalFull <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          if [ -n "$S" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - name: The added folders pass the PR checks (including the Lean allowlist)
        env:
          S: ${{ steps.plan.outputs.statements }}
          FULL: ${{ steps.plan.outputs.lexical_full }}
        run: |
          if [ "$FULL" == "true" ]; then python3 tools/arginf.py check-all
          elif [ -n "$S" ]; then python3 -m tools.incremental lexical $S
          else echo "no theorem folders added"; fi
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: false
          use-mathlib-cache: false
      - name: Restore dependency cache
        id: depcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Fetch dependencies and restore build caches
        if: steps.depcache.outputs.cache-hit != 'true'
        run: |
          lake exe cache get || true
          # cslib-frontier publishes build outputs for every main commit; fall back to building.
          (cd .lake/packages/cslib-frontier && bash scripts/cache/get.sh) || echo "frontier cache miss"
      # Saved before any theorem folder is compiled, so contributed Lean never touches the cache
      # that every PR check restores.
      - name: Save dependency cache for PR checks
        if: steps.depcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      # Only the added statements' modules; lake builds what they import. With no arguments these
      # commands mean "everything", so they are skipped when nothing was added.
      - name: Build
        if: steps.plan.outputs.any == 'true'
        env:
          S: ${{ steps.plan.outputs.statements }}
        run: lake build $(python3 -m tools.incremental targets $S)
      - name: Kernel re-check (leanchecker)
        id: kernel
        if: steps.plan.outputs.any == 'true'
        env:
          S: ${{ steps.plan.outputs.statements }}
        run: python3 tools/arginf.py kernel $S
      - name: Audit cache from the last publish
        env:
          REPO: ${{ github.repository }}
        run: |
          git fetch -q --depth=1 origin index 2>/dev/null && git show FETCH_HEAD:audit-cache.json > audit-cache.json 2>/dev/null || echo '{}' > audit-cache.json
      - name: Proof matches statement, allowed axioms only (cached passes are skipped)
        if: steps.plan.outputs.any == 'true'
        env:
          S: ${{ steps.plan.outputs.statements }}
        run: |
          python3 -m tools.incremental audit --cache audit-cache.json $S
          python3 -m tools.incremental built --cache audit-cache.json $S
      - run: python3 tools/arginf.py index > index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: index
          path: |
            index.json
            audit-cache.json
  readings:
    # One English reading per statement per allowlisted model, generated once and kept on the
    # index branch. Only new statements cost model time (~30 s each, plus a weights download).
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fetch existing readings
        env:
          REPO: ${{ github.repository }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$REPO/index/readings.json" -o existing.json || echo "[]" > existing.json
          curl -fsSL "https://raw.githubusercontent.com/$REPO/index/areas.json" -o existing-areas.json || echo "[]" > existing-areas.json
      - name: Generate readings and area labels for new statements
        run: |
          MODEL=$(python3 -c "import tomllib; print(tomllib.load(open('models.toml','rb'))['model'][0]['name'])")
          python3 -m tools.readings generate --model "$MODEL" --existing existing.json --out readings.json
          # Same pinned model and weights (already downloaded above); a few seconds per new statement.
          python3 -m tools.areas generate --model "$MODEL" --existing existing-areas.json --out areas.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readings
          path: |
            readings.json
            areas.json
  publish-index:
    # arginf.com reads index.json from the `index` branch. Runs only after a verified main build.
    needs: [verify, readings]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # provenance reads when each attempt was first added
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: index
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: readings
          path: out
      - name: Publish to the index branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # A failed readings job never blocks publishing: keep the previous readings instead.
          [ -f out/readings.json ] || curl -fsSL "https://raw.githubusercontent.com/$REPO/index/readings.json" -o out/readings.json || echo "[]" > out/readings.json
          [ -f out/areas.json ] || curl -fsSL "https://raw.githubusercontent.com/$REPO/index/areas.json" -o out/areas.json || echo "[]" > out/areas.json
          # Keep passes that full-check.yml recorded on the index branch since verify ran.
          git fetch -q --depth=1 origin index 2>/dev/null && git show FETCH_HEAD:audit-cache.json > out/latest-cache.json 2>/dev/null || echo '{}' > out/latest-cache.json
          python3 -m tools.incremental merge-cache --out out/audit-cache.json out/audit-cache.json out/latest-cache.json
          python3 -m tools.readings embed out/index.json out/readings.json
          python3 -m tools.areas embed out/index.json out/areas.json
          python3 -m tools.provenance embed out/index.json
          python3 -c "import json; json.load(open('out/index.json')); json.load(open('out/readings.json')); json.load(open('out/areas.json'))"
          git init -q -b index site && cp out/index.json out/readings.json out/areas.json out/audit-cache.json site/ && cd site
          git config user.name "arginf-bot" && git config user.email "actions@users.noreply.github.com"
          git add index.json readings.json areas.json audit-cache.json && git commit -qm "index for $SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" index
  alert:
    # A merged change that fails verification on main freezes the site at the last good index.
    # Open an issue so a maintainer reverts it quickly.
    needs: verify
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$REPO/issues" -f title="main failed verification at ${SHA:0:12}" \
            -f body="The main workflow failed at $SHA: $RUN_URL. The site keeps the last verified index until main is fixed or the merge is reverted." \
            -f "labels[]=main-broken" >/dev/null
  ledger:
    # Who merged what, from GitHub's records (labels, PR authors, merge times), for automerge's
    # caps and earned credit. Uploaded as an artifact; automerge reads the latest one.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # git history for merges from before the merge queue
      actions: read # the previous ledger artifact
      pull-requests: write # merged PRs, their labels and files; update their status comment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.ledger build --out ledger.json --announce
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ledger
          path: ledger.json
          retention-days: 90

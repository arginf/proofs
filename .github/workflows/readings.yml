# Generate English readings with an allowlisted open-weights model (models.toml) on CPU.
# Deterministic: fixed prompt, no system message, temperature 0, top-k 1, seed 0, 4 threads.
name: readings
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model name from models.toml"
        required: true
        default: "Qwen3-8B-Q4_K_M"
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(format('["{0}"]', inputs.model)) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # No Actions cache for model weights: the repo's 10 GB cache budget is reserved for the
      # Lean dependency cache that PR checks rely on. Weights are re-downloaded and SHA-checked.
      - name: Generate
        env:
          MODEL: ${{ matrix.model }}
        run: |
          nproc; free -g | head -2
          time python3 -m tools.readings generate --model "$MODEL" --out readings.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readings-${{ matrix.model }}
          path: readings.json

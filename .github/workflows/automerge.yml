# Merge complete, verified proofs on their own. Runs from main after "PR checks" succeed, and
# never checks out or executes PR code: tools/automerge.py inspects the PR through the API.
name: automerge
on:
  workflow_run:
    workflows: ["PR checks"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the moderation model (CPU)
        run: |
          python3 -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python3 -m pip install --quiet detoxify==0.5.2 transformers==4.44.2
      - name: Merge new statements, checkpoints and complete proofs that pass moderation
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # Optional private word list (one per line), kept out of the public repo.
          MODERATION_WORDS: ${{ secrets.MODERATION_WORDS }}
        run: python3 -m tools.automerge "$HEAD_SHA"

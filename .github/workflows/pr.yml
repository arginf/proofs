# Checks pull requests to this repository only (GitHub Actions terms: CI for this project,
# not a general compute service). Untrusted Lean from forks runs with a read-only token and
# no secrets, and only after the scope check passes. The scope check includes the lexical
# allowlist (tools/safety.py), so nothing in a theorem folder can run code while Lean compiles
# it; the kernel re-check below is the second layer. automerge.yml trusts only this file.
name: PR checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hash: ${{ steps.scope.outputs.hash }}
      attempt: ${{ steps.scope.outputs.attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tool tests
        run: python3 -m unittest discover -s tools/tests -t .
      - id: scope
        name: One folder, matching hash and branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Maintainers (write access or more) change tooling on infra/* branches in this repo;
          # everyone else is scoped. Org membership can be private, so ask the API.
          PERM=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
          if [[ "$HEAD_REF" == infra/* && "$SAME_REPO" == "true" && ( "$PERM" == "admin" || "$PERM" == "maintain" || "$PERM" == "write" ) ]]; then
            echo "maintainer infra change: scope check skipped"; echo "hash=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 tools/arginf.py check --base "$BASE_SHA" --branch "$HEAD_REF"
          echo "hash=${HEAD_REF%%/*}" >> "$GITHUB_OUTPUT"
          ATTEMPT=$(git diff --name-only "$BASE_SHA...HEAD" | sed -nE 's#^Theorems/[0-9a-f]{12}/attempts/([0-9a-f]{12})/.*#\1#p' | sort -u | head -1)
          echo "attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"
  lean:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HASH: ${{ needs.scope.outputs.hash }}
      ATTEMPT: ${{ needs.scope.outputs.attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Lean (pinned toolchain only)
        run: |
          # elan v4.4.0, pinned by checksum (not the moving master install script).
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan.tgz"
          echo "0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  $RUNNER_TEMP/elan.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/elan.tgz" -C "$RUNNER_TEMP" && "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      # Fast path: a folder that only imports Lean core compiles in seconds, with no Mathlib.
      - name: Fast check (core-only folders)
        id: fast
        run: |
          if [ -z "$HASH" ]; then echo "full=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e
          if [ -n "$ATTEMPT" ] && ! grep -qw sorry "Theorems/$HASH/attempts/$ATTEMPT/Attempt.lean"; then
            python3 tools/arginf.py fast "$HASH" --attempt "$ATTEMPT"
          else
            python3 tools/arginf.py fast "$HASH"
          fi
          code=$?
          set -e
          if [ $code -eq 3 ]; then echo "full=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      # Full path: restore the dependency build (Mathlib, CSLib, cslib-frontier) saved by main.
      - name: Restore dependency cache
        if: steps.fast.outputs.full == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Fetch any missing build outputs
        if: steps.fast.outputs.full == 'true'
        run: |
          lake exe cache get || true
          (cd .lake/packages/cslib-frontier && bash scripts/cache/get.sh) || echo "frontier cache miss"
      - name: Build
        if: steps.fast.outputs.full == 'true'
        run: lake build
      - name: Kernel re-check (leanchecker)
        if: steps.fast.outputs.full == 'true'
        run: |
          # Replays every declaration in the kernel, so nothing reached the environment unchecked.
          if [ -z "$HASH" ]; then python3 tools/arginf.py kernel; else python3 tools/arginf.py kernel "$HASH"; fi
      - name: Proof matches statement, allowed axioms only
        if: steps.fast.outputs.full == 'true'
        run: |
          # Every complete attempt is a proof and is audited; partial ones (sorry) merge as checkpoints.
          if [ -z "$HASH" ]; then python3 tools/arginf.py audit; else python3 tools/arginf.py audit "$HASH"; fi
          echo "checks passed"

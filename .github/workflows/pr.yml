# Checks pull requests to this repository only (GitHub Actions terms: CI for this project,
# not a general compute service). Untrusted Lean from forks runs with a read-only token and
# no secrets, and only after the scope check passes. The scope check includes the lexical
# allowlist (tools/safety.py), so nothing in a theorem folder can run code while Lean compiles
# it; the kernel re-check below is the second layer. automerge.yml trusts only this file.
name: PR checks
on:
  pull_request:
    branches: [main]
  # The merge queue re-runs these checks on each queued group (main plus the queued PRs). Job
  # names must stay the same for both events: they are the required checks.
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hash: ${{ steps.scope.outputs.hash }}
      attempt: ${{ steps.scope.outputs.attempt }}
      # Statements whose modules the lean job builds, kernel-checks and audits: only what this
      # change adds (tools/incremental.py), so the cost doesn't grow with the repo.
      statements: ${{ steps.scope.outputs.statements }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tool tests
        run: python3 -m unittest discover -s tools/tests -t .
      - id: scope
        name: One folder, matching hash and branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          # What a group or maintainer change adds, and whether it touches the toolchain or the
          # checking tools (tools/incremental.py). Contributor PRs never reach this: their scope is
          # their branch's one folder, checked by arginf.py below.
          planned() {
            PLAN=$(python3 -m tools.incremental plan --base "$BASE_SHA")
            STATEMENTS=$(jq -r '.statements | join(" ")' <<<"$PLAN")
            jq -r '.reasons[]' <<<"$PLAN"
            echo "full=$(jq -r .full <<<"$PLAN")" >> "$GITHUB_OUTPUT"
            echo "hash=" >> "$GITHUB_OUTPUT"; echo "statements=$STATEMENTS" >> "$GITHUB_OUTPUT"
            if [[ $(jq -r .lexicalFull <<<"$PLAN") == "true" ]]; then python3 tools/arginf.py check-all
            elif [[ -n "$STATEMENTS" ]]; then python3 -m tools.incremental lexical $STATEMENTS; fi
          }
          # A queued group: each PR in it already passed its own scope check, and rulesets require
          # code-owner review for anything outside Theorems/. Re-check the group's folders.
          if [[ "$EVENT" == "merge_group" ]]; then planned; exit 0; fi
          # Maintainers (write access or more) change tooling on infra/* branches in this repo;
          # everyone else is scoped. Org membership can be private, so ask the API.
          PERM=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
          if [[ "$HEAD_REF" == infra/* && "$SAME_REPO" == "true" && ( "$PERM" == "admin" || "$PERM" == "maintain" || "$PERM" == "write" ) ]]; then
            echo "maintainer infra change: scope check skipped"; planned; exit 0
          fi
          python3 tools/arginf.py check --base "$BASE_SHA" --branch "$HEAD_REF"
          echo "hash=${HEAD_REF%%/*}" >> "$GITHUB_OUTPUT"
          echo "statements=${HEAD_REF%%/*}" >> "$GITHUB_OUTPUT"
          ATTEMPT=$(git diff --name-only "$BASE_SHA...HEAD" | sed -nE 's#^Theorems/[0-9a-f]{2}/[0-9a-f]{20}/attempts/[0-9a-f]{2}/([0-9a-f]{20})/.*#\1#p' | sort -u | head -1)
          echo "attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"
  lean:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HASH: ${{ needs.scope.outputs.hash }}
      ATTEMPT: ${{ needs.scope.outputs.attempt }}
      STATEMENTS: ${{ needs.scope.outputs.statements }}
      FULL: ${{ needs.scope.outputs.full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Lean (pinned toolchain only)
        run: |
          # elan v4.4.0, pinned by checksum (not the moving master install script).
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan.tgz"
          echo "0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  $RUNNER_TEMP/elan.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/elan.tgz" -C "$RUNNER_TEMP" && "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      # Fast path: a folder that only imports Lean core compiles in seconds, with no Mathlib.
      - name: Fast check (core-only folders)
        id: fast
        run: |
          if [ -z "$HASH" ]; then
            # Groups and maintainer changes: build only their statements. A toolchain or Mathlib
            # bump also builds a capped sample here; the complete rebuild is full-check.yml.
            if [ -n "$STATEMENTS" ] || [ "$FULL" == "true" ]; then echo "full=true" >> "$GITHUB_OUTPUT"
            else echo "no theorem folders changed: nothing to build"; fi
            exit 0
          fi
          set +e
          if [ -n "$ATTEMPT" ] && ! grep -qw sorry "$(python3 tools/arginf.py path "$HASH" "$ATTEMPT")/Attempt.lean"; then
            python3 tools/arginf.py fast "$HASH" --attempt "$ATTEMPT"
          else
            python3 tools/arginf.py fast "$HASH"
          fi
          code=$?
          set -e
          if [ $code -eq 3 ]; then echo "full=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      # Full path: restore the dependency build (Mathlib, CSLib, cslib-frontier) saved by main.
      - name: Restore dependency cache
        if: steps.fast.outputs.full == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages
          key: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Fetch any missing build outputs
        if: steps.fast.outputs.full == 'true'
        run: |
          lake exe cache get || true
          (cd .lake/packages/cslib-frontier && bash scripts/cache/get.sh) || echo "frontier cache miss"
      - name: Choose what to build
        if: steps.fast.outputs.full == 'true'
        id: what
        run: |
          S="$STATEMENTS"
          if [ "$FULL" == "true" ]; then
            # Sample: the first 300 modules in shard order, so a bump that breaks common proofs
            # fails here. Every statement is rebuilt by full-check.yml once the bump is on main.
            SAMPLE=$(python3 -m tools.incremental matrix --cache /dev/null --ignore-cache --max-jobs 1 --max-modules 300 | jq -r '.include[0].statements // ""')
            S=$(echo "$S $SAMPLE" | tr ' ' '\n' | sort -u | tr '\n' ' ')
            echo "::notice::lean-toolchain, lake-manifest.json or lakefile.toml changed: building a sample here; full-check.yml rebuilds everything after merge"
          fi
          S=$(echo $S)  # trim
          echo "statements=$S" >> "$GITHUB_OUTPUT"
          # With no arguments, lake build, kernel and audit mean "everything": never call them empty.
          if [ -n "$S" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build
        if: steps.what.outputs.any == 'true'
        env:
          S: ${{ steps.what.outputs.statements }}
        run: lake build $(python3 -m tools.incremental targets $S)
      - name: Kernel re-check (leanchecker)
        if: steps.what.outputs.any == 'true'
        env:
          S: ${{ steps.what.outputs.statements }}
        # Replays every declaration in the kernel, so nothing reached the environment unchecked.
        run: python3 tools/arginf.py kernel $S
      - name: Proof matches statement, allowed axioms only
        if: steps.what.outputs.any == 'true'
        env:
          S: ${{ steps.what.outputs.statements }}
        run: |
          # Every complete attempt is a proof and is audited; partial ones (sorry) merge as checkpoints.
          python3 tools/arginf.py audit $S
          echo "checks passed"
